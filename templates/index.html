<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeetBase</title>
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">
        <h1>NeetBase</h1>

        <button class="add-button" onclick="openModal()">Add Question</button>

        <dialog id="edit-modal">

            <form id="edit-form" method="POST" class="question-form">

                <div class="modal-header">
                    <h2>Edit Question</h2>

                    <button type="button" class="close-button" onclick="closeEditModal()">
                        ×
                    </button>
                </div>

                <input id="edit-name" type="text" name="name" required>

                <select id="edit-difficulty" name="difficulty" required>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>

                <input id="edit-topics" type="text" name="topics" required>

                <textarea id="edit-description" name="description" rows="4"></textarea>

                <button type="submit" class="submit-button">
                    Save Changes
                </button>

            </form>

        </dialog>

        <dialog id="add-modal">
            <form action="/add" method="POST" class="question-form">

                <div class="modal-header">
                    <h2>Add Question</h2>
                    <button type="button" class="close-button" onclick="closeModal()">×</button>
                </div>

                <input type="text" name="name" placeholder="Problem name" required>

                <select name="difficulty" required>
                    <option value="" disabled selected>Difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>

                <input type="text" name="topics" placeholder="Topics" required>

                <textarea name="description" placeholder="Write your description..." rows="4"></textarea>

                <button type="submit" class="submit-button">
                    Add Problem
                </button>

            </form>
        </dialog>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Difficulty</th>
                    <th>Topics</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for problem in problems %}
                <tr>
                    <td>{{ problem[1] }}</td>
                    <td>{{ problem[2] }}</td>
                    <td>{{ problem[3] }}</td>
                    <td>{{ problem[4] }}</td>

                    <td class="actions-cell">
                        <button
                            type="button"
                            class="action-button edit-button"
                            data-problem='{{ {
                                "id": problem[0],
                                "name": problem[1],
                                "difficulty": problem[2],
                                "topics": problem[3] or "",
                                "description": problem[4] or ""
                            } | tojson | forceescape }}'
                            onclick="openEditModal(this)"
                            aria-label="Edit {{ problem[1] }}"
                        >
                            <span aria-hidden="true">&#9998;</span>
                            <span>Edit</span>
                        </button>

                        <form action="/delete/{{ problem[0] }}" method="POST" class="delete-form">
                            <button type="submit" class="action-button delete-button" aria-label="Delete {{ problem[1] }}">
                                <span aria-hidden="true">&#128465;</span>
                                <span>Delete</span>
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

    <script>
        const modal = document.getElementById("add-modal");

        function openModal() {
            modal.showModal();
        }

        function closeModal() {
            modal.close();
        }

        const editModal = document.getElementById("edit-modal");

        function openEditModal(button) {
            const problem = JSON.parse(button.dataset.problem);

            document.getElementById("edit-name").value = problem.name;
            document.getElementById("edit-difficulty").value = problem.difficulty;
            document.getElementById("edit-topics").value = problem.topics;
            document.getElementById("edit-description").value = problem.description;

            document.getElementById("edit-form").action = "/edit/" + problem.id;

            editModal.showModal();
        }

        function closeEditModal() {
            editModal.close();
        }

        document.querySelectorAll(".delete-form").forEach((form) => {
            form.addEventListener("submit", (event) => {
                if (!window.confirm("Delete this question? This cannot be undone.")) {
                    event.preventDefault();
                }
            });
        });
    </script>

</body>

</html>
